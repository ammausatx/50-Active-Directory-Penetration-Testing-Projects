<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#0b1020"/><text x="55" y="65" fill="#e2e8f0" font-family="Arial" font-size="30" font-weight="bold">KALI — DNS & CONNECTIVITY BASELINE</text><text x="55" y="100" fill="#fbbf24" font-family="Arial" font-size="17">SIMULATED TRAINING OUTPUT · EXAMPLE ONLY</text><rect x="55" y="140" width="1090" height="470" rx="15" fill="#020617" stroke="#334155"/><g font-family="Consolas,monospace" font-size="20"><text x="85" y="195" fill="#7dd3fc">$ ip -br address</text><text x="85" y="230" fill="#e2e8f0">eth0    UP    192.168.56.30/24</text><text x="85" y="285" fill="#7dd3fc">$ dig @192.168.56.10 _ldap._tcp.dc._msdcs.adlab.test SRV</text><text x="85" y="330" fill="#94a3b8">;; ANSWER SECTION:</text><text x="85" y="365" fill="#86efac">_ldap._tcp.dc._msdcs.adlab.test. 600 IN SRV 0 100 389 dc01.adlab.test.</text><text x="85" y="420" fill="#7dd3fc">$ ping -c 3 192.168.56.10</text><text x="85" y="465" fill="#e2e8f0">3 packets transmitted, 3 received, 0% packet loss</text><text x="85" y="520" fill="#7dd3fc">$ nmap -Pn -sT --top-ports 100 192.168.56.10</text><text x="85" y="555" fill="#fcd34d">Example only: review discovered services against the approved scope.</text></g></svg>