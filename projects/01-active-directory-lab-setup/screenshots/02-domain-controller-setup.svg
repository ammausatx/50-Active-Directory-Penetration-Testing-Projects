<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#0a0f18"/><rect x="35" y="35" width="1130" height="610" rx="14" fill="#111827" stroke="#334155"/><rect x="35" y="35" width="1130" height="48" rx="14" fill="#1f2937"/><circle cx="65" cy="59" r="8" fill="#f87171"/><circle cx="92" cy="59" r="8" fill="#fbbf24"/><circle cx="119" cy="59" r="8" fill="#4ade80"/><text x="155" y="66" fill="#cbd5e1" font-family="Arial" font-size="18">Administrator: Windows PowerShell (SIMULATED)</text><g font-family="Consolas,monospace" font-size="22"><text x="75" y="145" fill="#93c5fd">PS C:\&gt; Install-WindowsFeature AD-Domain-Services -IncludeManagementTools</text><text x="75" y="190" fill="#86efac">Success  Restart Needed  Exit Code  Feature Result</text><text x="75" y="225" fill="#cbd5e1">-------  --------------  ---------  --------------</text><text x="75" y="260" fill="#86efac">True     No              Success    {Active Directory Domain Services}</text><text x="75" y="330" fill="#93c5fd">PS C:\&gt; Get-Service NTDS,DNS,Netlogon</text><text x="75" y="375" fill="#cbd5e1">Status    Name       DisplayName</text><text x="75" y="410" fill="#cbd5e1">------    ----       -----------</text><text x="75" y="445" fill="#86efac">Running   DNS        DNS Server</text><text x="75" y="480" fill="#86efac">Running   Netlogon   Netlogon</text><text x="75" y="515" fill="#86efac">Running   NTDS       Active Directory Domain Services</text><text x="75" y="590" fill="#fbbf24">Illustrative output only — run commands in your own isolated lab.</text></g></svg>